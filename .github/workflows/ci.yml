# Prüf-Pipeline: läuft bei jedem Push auf master/refactor-Branches und bei Pull Requests.
# Fängt Lint-, Test- und Build-Fehler ab, bevor ein Release-Tag gesetzt wird.
name: CI

on:
  push:
    branches: [master, "refactor/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Electron-Binary & nativer Rebuild sind für Lint/Test/Renderer-Build nicht nötig.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Syntax-Check (main/preload)
        run: node --check main.js && node --check preload.js

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Renderer-Build
        run: npx vite build

  # Charakterisierungstests brauchen das echte Electron (better-sqlite3-ABI) und
  # laufen unter Electron-as-Node (ELECTRON_RUN_AS_NODE, keine GUI → kein xvfb).
  characterization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Abhängigkeiten installieren (inkl. Electron + nativer Rebuild)
        run: npm ci

      - name: Charakterisierungstests
        run: npm run test:core
